name: Build Wrapper Offline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build portable EXE
        run: npx electron-builder@26.15.3 --win portable --x64 --config electron-builder.yml

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-offline-windows-x64
          path: release/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build AppImage
        run: npx electron-builder@26.15.3 --linux AppImage --x64 --config electron-builder.yml

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-offline-linux-x64
          path: release/*.AppImage
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: wrapper-offline-windows-x64
          path: release-assets

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: wrapper-offline-linux-x64
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --repo "${{ github.repository }}" \
            --generate-notes \
            --title "Wrapper Offline ${{ github.ref_name }}"
